plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = providers.gradleProperty('mod_version').get()
group = 'com.colonybridge'

base {
    archivesName = 'colonybridge'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def generatedMetadataDir = layout.buildDirectory.dir('generated/sources/metadata/java')
sourceSets.main.java.srcDir(generatedMetadataDir)

tasks.register('generateBuildMetadata') {
    inputs.property('modVersion', project.version)
    outputs.dir(generatedMetadataDir)
    doLast {
        def output = generatedMetadataDir.get().file('com/colonybridge/ColonyBridgeConstants.java').asFile
        output.parentFile.mkdirs()
        output.text = """package com.colonybridge;

public final class ColonyBridgeConstants {
    public static final String MOD_ID = \"colonybridge\";
    public static final String MOD_NAME = \"Colony Bridge\";
    public static final String VERSION = \"${project.version}\";
    public static final String PROTOCOL_ID = \"com.colonybridge.snapshot\";
    public static final int SCHEMA_VERSION = 2;
    public static final int OUTPUT_LAYOUT_VERSION = 1;

    private ColonyBridgeConstants() {
    }
}
"""
    }
}

tasks.named('compileJava').configure { dependsOn tasks.named('generateBuildMetadata') }

neoForge {
    version = '21.1.238'

    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        colonybridge {
            sourceSet sourceSets.main
        }
    }
}

def instanceModsPath = providers.gradleProperty('colonybridge.devModsDir')
        .orElse(providers.environmentVariable('COLONYBRIDGE_DEV_MODS_DIR'))
        .orElse('C:/Users/marko/curseforge/minecraft/Instances/Create Adventures/mods')
        .get()
def instanceMods = file(instanceModsPath)
def localModJar = { pattern ->
    def matches = instanceMods.exists() ? instanceMods.listFiles().findAll { it.name ==~ pattern } : []
    if (matches.isEmpty()) {
        throw new GradleException("Required local development mod JAR not found in ${instanceMods}: ${pattern}")
    }
    matches.sort { -it.lastModified() }.first()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'

    compileOnly files(localModJar(/minecolonies-1\.1\.1319-1\.21\.1\.jar/))
    compileOnly files(localModJar(/structurize-.*\.jar/))
    compileOnly files(localModJar(/blockui-.*\.jar/))
    compileOnly files(localModJar(/domum-ornamentum-.*\.jar/))
    compileOnly files(localModJar(/multipiston-.*\.jar/))
    compileOnly files(localModJar(/jei-1\.21\.1-neoforge-.*\.jar/))

    runtimeOnly files(localModJar(/minecolonies-1\.1\.1319-1\.21\.1\.jar/))
    runtimeOnly files(localModJar(/structurize-.*\.jar/))
    runtimeOnly files(localModJar(/blockui-.*\.jar/))
    runtimeOnly files(localModJar(/domum-ornamentum-.*\.jar/))
    runtimeOnly files(localModJar(/multipiston-.*\.jar/))

}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-processing'])
}

tasks.register('runLogicTests', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free Colony Bridge logic tests.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.colonybridge.TestRunner'
}

tasks.register('exportContractFixtures', JavaExec) {
    group = 'verification'
    description = 'Serializes canonical contract fixtures from the real Java snapshot models.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.colonybridge.ContractFixtureExporter'
    args providers.gradleProperty('contractFixtureOutput').orElse(
            layout.buildDirectory.dir('contract-fixtures').map { it.asFile.absolutePath }
    ).get()
}

tasks.register('verifyVersionMetadata') {
    group = 'verification'
    description = 'Verifies Gradle, generated Java metadata, and the expanded mod manifest agree.'
    dependsOn tasks.named('generateBuildMetadata'), tasks.named('processResources')
    doLast {
        def expected = project.version.toString()
        def generated = generatedMetadataDir.get().file('com/colonybridge/ColonyBridgeConstants.java').asFile.text
        def manifest = layout.buildDirectory.file('resources/main/META-INF/neoforge.mods.toml').get().asFile.text
        if (!generated.contains("VERSION = \"${expected}\"")) {
            throw new GradleException('Generated Java-visible version does not match the Gradle project version.')
        }
        if (!manifest.contains("version=\"${expected}\"")) {
            throw new GradleException('Expanded NeoForge manifest version does not match the Gradle project version.')
        }
    }
}

tasks.named('test').configure {
    dependsOn tasks.named('runLogicTests')
    dependsOn tasks.named('verifyVersionMetadata')
    failOnNoDiscoveredTests = false
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
        mod_id: 'colonybridge',
        mod_name: 'Colony Bridge',
        mod_version: version,
        minecraft_version_range: '[1.21.1,1.22)',
        neo_version_range: '[21.1.0,)',
        minecolonies_version_range: '[1.1.1319-1.21.1,)'
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

jar {
    includeEmptyDirs = false
    manifest {
        attributes([
            'Specification-Title': 'Colony Bridge',
            'Specification-Vendor': 'Colony Bridge',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Colony Bridge'
        ])
    }
}
